<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="FunDive app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#014f86"/>
      <stop offset="1" stop-color="#012a4a"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#89c2d9"/>
      <stop offset="0.5" stop-color="#2a6f97"/>
      <stop offset="1" stop-color="#013a63"/>
    </linearGradient>
    <clipPath id="frameClipA"><rect x="20" y="64" width="200" height="112" rx="44"/></clipPath>
  </defs>

  <!-- app-icon background -->
  <rect width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- faint bubbles in the field -->
  <g fill="#89c2d9" opacity="0.18">
    <circle cx="46" cy="52" r="10"/>
    <circle cx="196" cy="196" r="14"/>
    <circle cx="206" cy="60" r="6"/>
  </g>

  <!-- dive-mask mark, centered & scaled to sit inside the safe circle -->
  <g transform="translate(120,122) scale(0.74) translate(-120,-108)">
    <!-- strap buckles -->
    <rect x="2" y="104" width="26" height="34" rx="8" fill="#0b0b0b"/>
    <rect x="212" y="104" width="26" height="34" rx="8" fill="#0b0b0b"/>

    <!-- dive-flag fill clipped to frame -->
    <g clip-path="url(#frameClipA)">
      <rect x="20" y="64" width="200" height="112" fill="#ffffff"/>
      <line x1="0" y1="44" x2="240" y2="196" stroke="#e63329" stroke-width="52"/>
    </g>

    <!-- frame outline -->
    <rect x="20" y="64" width="200" height="112" rx="44" fill="none" stroke="#0b0b0b" stroke-width="12"/>

    <!-- glass lenses -->
    <rect x="44" y="102" width="66" height="62" rx="20" fill="url(#glassA)" stroke="#0b0b0b" stroke-width="8"/>
    <rect x="130" y="102" width="66" height="62" rx="20" fill="url(#glassA)" stroke="#0b0b0b" stroke-width="8"/>
    <ellipse cx="64" cy="120" rx="12" ry="7" fill="#ffffff" opacity="0.55"/>
    <ellipse cx="150" cy="120" rx="12" ry="7" fill="#ffffff" opacity="0.55"/>
  </g>
</svg>
